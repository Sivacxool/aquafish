name: iOS personal install

on:
  push:
    branches: [main, codex/ios-personal-install, codex/ov3660-camera, codex/ph-ads1115, codex/auto-pair]
    paths:
      - aqua_hatch/**
      - .github/workflows/ios.yml
      - IOS_INSTALL_TH.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: aqua_hatch
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify camera certificate with Apple trust policy
        run: |
          mkdir -p build/ios-delivery
          set -o pipefail
          swift tools/verify_apple_device_certificates.swift assets/device/camera_ca.pem test/fixtures/camera_server_public.pem aquahatch-camera-7c60.local 2>&1 | tee build/ios-delivery/apple-camera-trust.log
          if swift tools/verify_apple_device_certificates.swift test/fixtures/legacy_camera_ca.pem test/fixtures/legacy_camera_server_public.pem aquahatch-camera-7c60.local > build/ios-delivery/apple-legacy-trust.log 2>&1; then
            echo 'Expected Apple to reject the legacy ten-year leaf certificate'; exit 1
          fi
          grep -q 'maximum temporal validity period' build/ios-delivery/apple-legacy-trust.log
          if swift tools/verify_apple_device_certificates.swift assets/device/camera_ca.pem test/fixtures/camera_server_public.pem wrong-camera.local > build/ios-delivery/apple-wrong-host.log 2>&1; then
            echo 'Wrong camera hostname was accepted'; exit 1
          fi
      - name: Verify pH calibration math
        run: |
          c++ -std=c++17 ../tools/test_ph_calibration.cpp -o build/ios-delivery/test-ph-calibration
          build/ios-delivery/test-ph-calibration
      - name: Verify main S3 certificate with Apple trust policy
        run: |
          set -o pipefail
          swift tools/verify_apple_device_certificates.swift assets/device/device_ca.pem test/fixtures/s3_server_public.pem aquahatch-117c.local 2>&1 | tee build/ios-delivery/apple-s3-trust.log
      - name: Verify first-boot identity and generated certificate on Apple
        run: |
          git clone --depth 1 --branch mbedtls-3.6.6 --recurse-submodules --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/mbedtls"
          test "$(git -C "$RUNNER_TEMP/mbedtls" rev-parse HEAD)" = 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20
          git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ArduinoJson"
          cmake -S ../tools/runtime-certificates -B build/runtime-host -DMBEDTLS_SOURCE="$RUNNER_TEMP/mbedtls" -DARDUINOJSON_SOURCE="$RUNNER_TEMP/ArduinoJson" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/runtime-host --parallel 4
          build/runtime-host/test-runtime-certificates build/runtime-private
          build/runtime-host/test-first-boot-identity build/runtime-private
          set -o pipefail
          swift tools/verify_apple_device_certificates.swift build/runtime-private/ca.pem build/runtime-private/server.pem aquahatch-s3-aabbccddee01.local 2>&1 | tee build/ios-delivery/apple-runtime-trust.log
          if swift tools/verify_apple_device_certificates.swift build/runtime-private/ca.pem build/runtime-private/server.pem wrong-board.local > build/ios-delivery/apple-runtime-wrong-host.log 2>&1; then
            echo 'Unexpected acceptance of wrong runtime device'; exit 1
          fi
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ee80f08bbf97172ec030b8751ceab557177a34a6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          xcodebuild -version
      - name: Resolve locked dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --reporter expanded --concurrency=2
      - name: Build unsigned device application
        run: |
          mkdir -p build/ios-delivery
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build/ios-delivery/device-build.log
      - name: Package and verify unsigned IPA
        run: |
          mkdir -p build/ios-delivery/stage/Payload
          ditto build/ios/iphoneos/Runner.app build/ios-delivery/stage/Payload/Runner.app
          ditto -c -k --keepParent build/ios-delivery/stage/Payload build/ios-delivery/AquaHatch-v0.14.0-iOS-unsigned.ipa
          python3 tools/verify_ios_ipa.py build/ios-delivery/AquaHatch-v0.14.0-iOS-unsigned.ipa
          cp ../IOS_INSTALL_TH.md build/ios-delivery/
      - name: Upload install package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AquaHatch-iOS-unsigned-${{ github.sha }}
          path: |
            aqua_hatch/build/ios-delivery/*.ipa
            aqua_hatch/build/ios-delivery/*verification.json
            aqua_hatch/build/ios-delivery/IOS_INSTALL_TH.md
          if-no-files-found: error
          retention-days: 30
      - name: Build and launch iPhone Simulator
        run: bash tools/smoke_ios_simulator.sh
      - name: Upload verification logs and simulator image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AquaHatch-iOS-verification-${{ github.sha }}
          path: |
            aqua_hatch/build/ios-delivery/*.log
            aqua_hatch/build/ios-delivery/*.png
            aqua_hatch/build/ios-delivery/*verification.json
          if-no-files-found: ignore
          retention-days: 30
