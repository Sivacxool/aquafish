name: aqua_hatch
description: แอปภาษาไทยสำหรับเครื่องฟักไข่ปลาดุกอัจฉริยะ
publish_to: 'none'
version: 0.22.3+2027

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  http: ^1.6.0
  crypto: ^3.0.7
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  mobile_scanner: 7.5.0
  flutter_onnxruntime: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/water.jpg
    - assets/device/device_ca.pem
    - assets/device/camera_ca.pem
    - assets/models/fishfry_heads_v1.onnx
    - assets/models/fishfry_heads_v2.onnx
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
