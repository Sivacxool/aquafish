name: aqua_hatch
description: แอปภาษาไทยสำหรับเครื่องฟักไข่ปลาดุกอัจฉริยะ
publish_to: 'none'
version: 0.6.0+8

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  http: ^1.6.0
  crypto: ^3.0.7
  web_socket_channel: ^3.0.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/device/device_ca.pem
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
